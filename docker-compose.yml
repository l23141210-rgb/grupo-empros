services:
  db:
    image: mysql:8.0
    container_name: empros_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: grupo_empros
      MYSQL_USER: empros
      MYSQL_PASSWORD: emprospass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  inventory:
    build:
      context: ./inventory
      dockerfile: Dockerfile
    container_name: empros_inventory
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: empros
      DB_PASSWORD: emprospass
      DB_NAME: grupo_empros
      SECRET_KEY: 15ea22a503dc52a4cd5dffa1acb6e5ec31270f8d511f2bb18c8fed3a5cada37f
      FLASK_ENV: development
    volumes:
      - ./inventory:/app
      - pdf_reports:/app/reports
    depends_on:
      db:
        condition: service_healthy

  catalog:
    build:
      context: ./catalog
      dockerfile: Dockerfile
    container_name: empros_catalog
    restart: unless-stopped
    ports:
      - "5004:5002"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: empros
      DB_PASSWORD: emprospass
      DB_NAME: grupo_empros
      WHATSAPP_NUMERO: "524421600426"
      WHATSAPP_MENSAJE: "Hola, vi el catalogo de Grupo Empros y me interesa cotizar materiales."
    volumes:
      - ./catalog:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  pdf_reports: