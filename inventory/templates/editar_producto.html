{% extends "base.html" %}
{% block title %}Editar producto | GRUPO EMPROS{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1>Editar producto</h1><p>{{ producto.codigo }} — {{ producto.descripcion }}</p></div>
</div>
<div class="panel" style="padding:24px; max-width:720px;">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-grid">
            <div class="form-group">
                <label>Código *</label>
                <input type="text" name="codigo" value="{{ producto.codigo }}" required>
            </div>
            <div class="form-group">
                <label>Categoría</label>
                <input type="text" name="categoria" value="{{ producto.categoria or '' }}">
            </div>
            <div class="form-group full">
                <label>Descripción *</label>
                <input type="text" name="descripcion" value="{{ producto.descripcion }}" required>
            </div>
            <div class="form-group">
                <label>Unidad</label>
                <input type="text" name="unidad" value="{{ producto.unidad or '' }}">
            </div>
            <div class="form-group">
                <label>Almacén</label>
                <input type="text" name="almacen" value="{{ producto.almacen or '' }}">
            </div>
            <div class="form-group">
                <label>Stock actual (solo lectura)</label>
                <input type="number" value="{{ producto.stock_actual }}" disabled>
            </div>
            <div class="form-group">
                <label>Stock mínimo</label>
                <input type="number" name="stock_minimo" value="{{ producto.stock_minimo }}" min="0">
            </div>
            <div class="form-group">
                <label>Stock máximo</label>
                <input type="number" name="stock_maximo" value="{{ producto.stock_maximo }}" min="0">
            </div>
            <div class="form-group">
                <label>Precio de venta</label>
                <input type="number" name="precio_venta" value="{{ producto.precio_venta or 0 }}" min="0" step="0.01">
            </div>
            <div class="form-group full">
                <label>Observaciones</label>
                <textarea name="observaciones" rows="2">{{ producto.observaciones or '' }}</textarea>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
            <a href="{{ url_for('inventario') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
