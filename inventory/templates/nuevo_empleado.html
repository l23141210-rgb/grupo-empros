{% extends "base.html" %}
{% block title %}Nuevo usuario | GRUPO EMPROS{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Crear usuario</h1>
        <p>El empleado solo podrá visualizar, no modificar</p>
    </div>
</div>

<div class="panel" style="padding:24px; max-width:560px;">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>Nombre completo</label>
            <input type="text" name="nombre" required>
        </div>
        <div class="form-group">
            <label>Usuario (login)</label>
            <input type="text" name="usuario" required autocomplete="off">
        </div>
        <div class="form-group">
            <label>Contraseña (mínimo 8 caracteres)</label>
            <input type="password" name="password" required minlength="8">
        </div>
        <div class="form-group">
            <label>Rol</label>
            <select name="rol">
                <option value="empleado">Empleado (solo lectura)</option>
                <option value="administrador">Administrador</option>
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Crear usuario</button>
            <a href="{{ url_for('empleados') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
