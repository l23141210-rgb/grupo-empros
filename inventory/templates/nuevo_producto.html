{% extends "base.html" %}
{% block title %}Nuevo producto | GRUPO EMPROS{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1>Nuevo producto</h1><p>Registrar material en el inventario</p></div>
</div>
<div class="panel" style="padding:24px; max-width:720px;">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-grid">
            <div class="form-group">
                <label>Código *</label>
                <input type="text" name="codigo" required>
            </div>
            <div class="form-group">
                <label>Categoría</label>
                <input type="text" name="categoria">
            </div>
            <div class="form-group full">
                <label>Descripción *</label>
                <input type="text" name="descripcion" required>
            </div>
            <div class="form-group">
                <label>Unidad</label>
                <input type="text" name="unidad" placeholder="pza, kg, m...">
            </div>
            <div class="form-group">
                <label>Almacén</label>
                <input type="text" name="almacen">
            </div>
            <div class="form-group">
                <label>Stock actual</label>
                <input type="number" name="stock_actual" value="0" min="0">
            </div>
            <div class="form-group">
                <label>Stock mínimo</label>
                <input type="number" name="stock_minimo" value="0" min="0">
            </div>
            <div class="form-group">
                <label>Stock máximo</label>
                <input type="number" name="stock_maximo" value="0" min="0">
            </div>
            <div class="form-group">
                <label>Precio de venta</label>
                <input type="number" name="precio_venta" value="0" min="0" step="0.01">
            </div>
            <div class="form-group full">
                <label>Observaciones</label>
                <textarea name="observaciones" rows="2"></textarea>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar producto</button>
            <a href="{{ url_for('inventario') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
