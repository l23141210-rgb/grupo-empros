{% extends "base.html" %}
{% block title %}Nuevo movimiento | GRUPO EMPROS{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1>Registrar movimiento</h1><p>Entrada o salida de material</p></div>
</div>
<div class="panel" style="padding:24px; max-width:560px;">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>Producto *</label>
            <select name="producto_id" required>
                <option value="">— Selecciona —</option>
                {% for p in productos %}
                <option value="{{ p.id }}">{{ p.codigo }} — {{ p.descripcion }} (stock: {{ p.stock_actual }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Tipo *</label>
            <select name="tipo" required>
                <option value="entrada">Entrada</option>
                <option value="salida">Salida</option>
            </select>
        </div>
        <div class="form-group">
            <label>Cantidad *</label>
            <input type="number" name="cantidad" min="1" required>
        </div>
        <div class="form-group">
            <label>Observaciones</label>
            <textarea name="observaciones" rows="2"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Registrar</button>
            <a href="{{ url_for('inventario') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
